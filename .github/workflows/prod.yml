name: Budget App Deploy Workflow

on:
    pull_request:
        branches:
            - main
        types:
            - closed

permissions:
    contents: read

concurrency:
    group: production-gas-deployment
    cancel-in-progress: false

jobs:
    Build-And-Deploy-Budget-App:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        timeout-minutes: 5

        env:
            # GASプロジェクトやclaspに関わる変数
            ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
            ACCESS_TOKEN_DEFAULT: ${{ secrets.ACCESS_TOKEN_DEFAULT }}
            ID_TOKEN: ${{ secrets.ID_TOKEN }}
            REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
            REFRESH_TOKEN_DEFAULT: ${{ secrets.REFRESH_TOKEN_DEFAULT }}
            CLIENT_ID: ${{ secrets.CLIENTID }}
            CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
            SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
            GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID_PROD }}
            # コード内で置換される変数
            TARGET_EMAIL_ADDRESS: ${{ secrets.TARGET_EMAIL_ADDRESS }}
            TARGET_SHEET_NAME: "金銭メモ2026"
            TEST_DATE: ""

        steps:
            - name: リポジトリのチェックアウト
              uses: actions/checkout@v3
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}

            - name: Node.jsのセットアップ
              uses: actions/setup-node@v3
              with:
                  node-version: "21"

            - name: 依存関係のキャッシュの復元
              uses: actions/cache@v3
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

            - name: 依存関係のインストール
              run: npm install

            - name: claspのインストール
              run: npm install -g @google/clasp

            - name: .clasprc.json の生成
              run: |
                  bash scripts/deployment/setup_clasprcjson.sh

            - name: .clasp.json の生成
              run: |
                  bash scripts/deployment/setup_claspjson.sh

            - name: メール送信先の変数置換
              run: |
                  sed -i 's/TARGET_EMAIL_ADDRESS_PLACEHOLDER/'"${TARGET_EMAIL_ADDRESS}"'/g' scripts/infrastructure/gas/scriptRuntime.js

            - name: TEST_DATE_PLACEHOLDER の置換(infrastructure/gas/scriptRuntime.js)
              run: |
                  sed -i 's/TEST_DATE_PLACEHOLDER/${{ env.TEST_DATE }}/g' scripts/infrastructure/gas/scriptRuntime.js

            - name: メインスクリプトの変数置換
              run: |
                  sed -i 's/TARGET_SHEET_NAME/'"${TARGET_SHEET_NAME}"'/g' src/layout/main.ts

            - name: Prod環境のGASデプロイIDを確認
              run: |
                  test -n "$GAS_DEPLOYMENT_ID" || {
                      echo "GAS_DEPLOYMENT_ID_PROD Secret が未設定です。"
                      exit 1
                  }
                  clasp list-deployments | grep -F -- "- $GAS_DEPLOYMENT_ID " > /dev/null || {
                      echo "GAS_DEPLOYMENT_ID_PROD が、このProd GASプロジェクトのアクティブなデプロイIDではありません。"
                      exit 1
                  }

            - name: アプリのビルドとGASへのプッシュ
              run: make build-and-push

            - name: Prod環境のGASデプロイを新バージョンへ更新
              run: |
                  COMMIT_SUBJECT="$(git log -1 --format=%s)"
                  clasp update-deployment "$GAS_DEPLOYMENT_ID" \
                    --description "$COMMIT_SUBJECT"
